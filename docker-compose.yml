version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: paperlens-db
    restart: always
    environment:
      POSTGRES_DB: paperlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperlens-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=paperlens-backend
      - ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/paperlens
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
