version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paperlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paperlens_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paperlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperlens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paperlens_db}
      SECRET_KEY: ${SECRET_KEY:-paperlens-super-secret-production-key-change-me-12345}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USE_LOCAL_FALLBACK: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_models:/app/models_cache

volumes:
  postgres_data:
  backend_uploads:
  backend_models:
